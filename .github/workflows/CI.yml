name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['7.3', '7.4', '8.0']
    steps:
      - uses: actions/checkout@v1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, gd, zip
          ini-values: max_execution_time=600, memory_limit=-1
          coverage: xdebug
      - name: Validate composer.json
        run: |
          curl -sS https://getcomposer.org/installer | php -- --filename=composer
          composer validate
      - name: Install dependency
        run: |
          composer install
      - name: Check code standart
        run: |
          composer check-style
      - name: Analyze code
        run: |
          composer check-static-analyze
      - name: Run tests
        run: |
          composer unit
  url-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url-version: ['0.3.2', '1.1.0']
        php-version: ['7.4', '8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gd, zip
          coverage: xdebug
          tools: composer:v2
      - name: Install selected URL version
        run: composer update --with otis22/vetmanager-url:${{ matrix.url-version }} --prefer-dist --no-interaction
      - name: Run offline unit tests
        run: composer unit
      - name: Analyze code with selected URL version
        run: composer check-static-analyze
